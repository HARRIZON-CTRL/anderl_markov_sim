# Ambiente conda para la actividad final de ML II (recreación de Anderl et al., 2016)
# Crear:    conda env create -f environment.yml
# Activar:  conda activate anderl
# Solo lo necesario: las librerías del análisis + ipykernel (lo que VS Code necesita
# para correr el notebook). joblib viene con scikit-learn y reparte el trabajo entre núcleos.
name: anderl
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - joblib>=1.3
  - matplotlib>=3.7
  - networkx>=3.0
  - ipykernel
variables:
  # Ignora paquetes instalados fuera de conda (AppData\Roaming\Python), que rompían el kernel
  PYTHONNOUSERSITE: "1"
